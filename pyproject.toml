[project]
name = "poseidon"
version = "0.1.0"
description = "Trading signal platform for OpenClaw"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "celery[redis]>=5.4",
    "celery-redbeat>=2.2",
    "optuna>=4.8",
    "redis>=5.0",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "ccxt>=4.0",
    "requests>=2.31",
    "finlab>=0.4",
    "shioaji>=1.3.3; platform_machine == 'x86_64' and (sys_platform == 'linux' or sys_platform == 'win32')",
    "pandas_ta>=0.3",
    "TA-Lib>=0.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "msgpack>=1.0",
    "scipy>=1.12",
    "numpy>=1.26",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "xgboost>=2.0",
    "joblib>=1.3",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
qlib = [
    "pyqlib>=0.9",
    "shap>=0.50",
    # Plan 90-04.1: tianshou (qlib RL trainer dep) requires shimmy as the
    # OpenAI Gym → Gymnasium adapter. Without it, train_onpolicy crashes at
    # SubprocEnvWorker init with `ModuleNotFoundError: No module named 'shimmy'`.
    "shimmy>=2.0",
    # Phase 68: qlib research runs include XGBModel, so the research image
    # must install xgboost with the qlib extra instead of relying on gpu-only deps.
    "xgboost>=2.0",
    # Phase 41 D-14: mlflow as explicit dependency for the metrics bridge
    # (previously transitive via pyqlib). The qlib_train task scrapes
    # mlflow.get_run() metrics into training_runs.metrics JSONB.
    "mlflow>=2.0",
    # mlflow imports `google.protobuf.service` which was removed in
    # protobuf 5.x — pin to 4.x to avoid ImportError at qlib.init().
    "protobuf>=4.21,<5",
    # mlflow imports `pkg_resources` which was removed from setuptools 81+.
    # Pin to <81 so the legacy import still works.
    "setuptools>=68,<81",
    # Phase 90 (RL Order Execution): qlib.rl.contrib needs tianshou as the
    # reinforcement-learning runtime and gymnasium for env/space contracts.
    # pyqlib does NOT pull these transitively (RESEARCH §Pitfall 2).
    # Pin tianshou below 2.x — 2.x is a major API rewrite that breaks the
    # qlib.rl.order_execution.policy shim (RESEARCH A1).
    "tianshou>=0.5,<2",
    "gymnasium>=0.29,<2",
    # Phase 95 ACTIVATE-05: qlib.contrib.report.* modules import plotly.graph_objs
    # at module-top. pyqlib does NOT pull plotly transitively (verified on
    # qlib-research image — `import plotly` raises ModuleNotFoundError).
    # Pin >=5 because plotly 5.x's go.Figure.write_html() API is the one we use.
    "plotly>=5,<7",
    # Phase 95 ACTIVATE-05: qlib.contrib.report.analysis_model.analysis_model_performance
    # imports statsmodels.api + matplotlib.pyplot at module-top. pyqlib does NOT
    # pull these transitively. statsmodels is used for QQ-plot distribution fits;
    # matplotlib is a fallback graph backend behind plotly.
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseidon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Phase 95 ACTIVATE-01: tests import driver scripts via `from scripts.X import Y`
# (mirroring the existing v18 driver test patterns). Add the project root to
# the test pythonpath so `scripts/` is importable as a package.
pythonpath = ["."]
# Phase 93 W0: register pytest markers in pyproject.toml (in addition to the
# `pytest_configure` registration in tests/conftest.py for backward compat).
# `--strict-markers` users (including future CI) require markers to be declared
# at config-file level, not just runtime.
markers = [
    "phase38: Phase 38 data-foundation tests",
    "stormtrooper: smoke tests gated to stormtrooper qlib-research container (set STORMTROOPER=1 to enable)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort — import sorting
    "UP",   # pyupgrade — modernise syntax
    "B",    # bugbear — common bug patterns
    "SIM",  # simplify — unnecessary complexity
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # function-call-in-default-argument — FastAPI Depends()
    "RUF012", # mutable-class-default — SQLAlchemy / Pydantic
    "RUF001", # ambiguous-unicode-character-string — Chinese text is intentional
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.isort]
known-first-party = ["poseidon"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
