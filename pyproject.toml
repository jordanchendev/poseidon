[project]
name = "poseidon"
version = "0.1.0"
description = "Trading signal platform for OpenClaw"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "celery[redis]>=5.4",
    "celery-redbeat>=2.2",
    "optuna>=4.8",
    "redis>=5.0",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "ccxt>=4.0",
    "requests>=2.31",
    "finlab>=0.4",
    "shioaji>=1.3.3; platform_machine == 'x86_64' and (sys_platform == 'linux' or sys_platform == 'win32')",
    "pandas_ta>=0.3",
    "TA-Lib>=0.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "msgpack>=1.0",
    "scipy>=1.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "xgboost>=2.0",
    "joblib>=1.3",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
qlib = [
    "pyqlib>=0.9",
    "shap>=0.50",
    # Phase 41 D-14: mlflow as explicit dependency for the metrics bridge
    # (previously transitive via pyqlib). The qlib_train task scrapes
    # mlflow.get_run() metrics into training_runs.metrics JSONB.
    "mlflow>=2.0",
    # mlflow imports `google.protobuf.service` which was removed in
    # protobuf 5.x — pin to 4.x to avoid ImportError at qlib.init().
    "protobuf>=4.21,<5",
    # mlflow imports `pkg_resources` which was removed from setuptools 81+.
    # Pin to <81 so the legacy import still works.
    "setuptools>=68,<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseidon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
