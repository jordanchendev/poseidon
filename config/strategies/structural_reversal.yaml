strategy: structural_reversal
name: "Structural Reversal 4H"
market: crypto_perp
interval: "4h"
symbols:
  - BTCUSDT
  - ETHUSDT

# Entry conditions
oiwap_threshold: 3.0       # primary gate
use_cvd_filter: false      # set true for 3-condition variant

# Limit price derivation
atr_multiplier: 1.0        # optimizable: 0.5 / 1.0 / 1.5 / 2.0

# Exit parameters
stop_atr_multiplier: 3.0   # optimizable: 2.0 / 3.0 / 4.0 / 5.0
max_holding_bars: 40        # ~7 days at 4H
order_expiry_bars: 6        # 24h at 4H

# Risk
max_drawdown: 0.20          # 20% portfolio-level hard stop
