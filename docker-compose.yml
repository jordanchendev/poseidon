services:
  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_API_KEY=${POSEIDON_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  beat:
    build: .
    command: celery -A poseidon.workers.celery_app beat --loglevel=info
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    command: celery -A poseidon.workers.celery_app worker -Q gpu -c 1 --loglevel=info
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-artifacts:/data/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cpu-worker:
    build: .
    command: celery -A poseidon.workers.celery_app worker -Q cpu -c 4 --loglevel=info
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_FINMIND_TOKEN=${POSEIDON_FINMIND_TOKEN}
      - POSEIDON_FINLAB_API_TOKEN=${POSEIDON_FINLAB_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-artifacts:/data/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model-artifacts:
