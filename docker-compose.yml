services:
  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_API_KEY=${POSEIDON_API_KEY}
      - POSEIDON_TW_STOCK_DATA_BACKEND=${POSEIDON_TW_STOCK_DATA_BACKEND:-finlab}
      - POSEIDON_SHIOAJI_DATA_API_KEY=${POSEIDON_SHIOAJI_DATA_API_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SECRET_KEY=${POSEIDON_SHIOAJI_DATA_SECRET_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SIMULATION=${POSEIDON_SHIOAJI_DATA_SIMULATION:-true}
      - POSEIDON_US_STOCK_DATA_BACKEND=${POSEIDON_US_STOCK_DATA_BACKEND:-yfinance}
      - POSEIDON_POLYGON_API_KEY=${POSEIDON_POLYGON_API_KEY:-}
    volumes:
      - model-artifacts:/data/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  beat:
    build: .
    command: celery -A poseidon.workers.celery_app beat --loglevel=info
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_TW_STOCK_DATA_BACKEND=${POSEIDON_TW_STOCK_DATA_BACKEND:-finlab}
      - POSEIDON_SHIOAJI_DATA_API_KEY=${POSEIDON_SHIOAJI_DATA_API_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SECRET_KEY=${POSEIDON_SHIOAJI_DATA_SECRET_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SIMULATION=${POSEIDON_SHIOAJI_DATA_SIMULATION:-true}
      - POSEIDON_US_STOCK_DATA_BACKEND=${POSEIDON_US_STOCK_DATA_BACKEND:-yfinance}
      - POSEIDON_POLYGON_API_KEY=${POSEIDON_POLYGON_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    command: celery -A poseidon.workers.celery_app worker -Q gpu -c 1 --loglevel=info
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_FINMIND_TOKEN=${POSEIDON_FINMIND_TOKEN}
      - POSEIDON_FINLAB_API_TOKEN=${POSEIDON_FINLAB_API_TOKEN}
      - POSEIDON_TW_STOCK_DATA_BACKEND=${POSEIDON_TW_STOCK_DATA_BACKEND:-finlab}
      - POSEIDON_SHIOAJI_DATA_API_KEY=${POSEIDON_SHIOAJI_DATA_API_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SECRET_KEY=${POSEIDON_SHIOAJI_DATA_SECRET_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SIMULATION=${POSEIDON_SHIOAJI_DATA_SIMULATION:-true}
      - POSEIDON_US_STOCK_DATA_BACKEND=${POSEIDON_US_STOCK_DATA_BACKEND:-yfinance}
      - POSEIDON_POLYGON_API_KEY=${POSEIDON_POLYGON_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-artifacts:/data/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cpu-worker:
    build: .
    command: celery -A poseidon.workers.celery_app worker -Q cpu -c 6 --loglevel=info
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_FINMIND_TOKEN=${POSEIDON_FINMIND_TOKEN}
      - POSEIDON_FINLAB_API_TOKEN=${POSEIDON_FINLAB_API_TOKEN}
      - POSEIDON_TW_STOCK_DATA_BACKEND=${POSEIDON_TW_STOCK_DATA_BACKEND:-finlab}
      - POSEIDON_SHIOAJI_DATA_API_KEY=${POSEIDON_SHIOAJI_DATA_API_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SECRET_KEY=${POSEIDON_SHIOAJI_DATA_SECRET_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SIMULATION=${POSEIDON_SHIOAJI_DATA_SIMULATION:-true}
      - POSEIDON_US_STOCK_DATA_BACKEND=${POSEIDON_US_STOCK_DATA_BACKEND:-yfinance}
      - POSEIDON_POLYGON_API_KEY=${POSEIDON_POLYGON_API_KEY:-}
      - UPTIME_KUMA_PUSH_URL=${UPTIME_KUMA_PUSH_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-artifacts:/data/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backfill-worker:
    # Phase 39-02 Task 3: dedicated consumer for the 'backfill' queue so a
    # one-shot historical job never starves live ingest on cpu-worker.
    # Smoke check after deploy:
    #   docker compose exec api celery -A poseidon.workers.celery_app \
    #       inspect active_queues
    build: .
    command: celery -A poseidon.workers.celery_app worker -Q backfill -c 1 --loglevel=info
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_FINMIND_TOKEN=${POSEIDON_FINMIND_TOKEN}
      - POSEIDON_FINLAB_API_TOKEN=${POSEIDON_FINLAB_API_TOKEN}
      - POSEIDON_TW_STOCK_DATA_BACKEND=${POSEIDON_TW_STOCK_DATA_BACKEND:-finlab}
      - POSEIDON_SHIOAJI_DATA_API_KEY=${POSEIDON_SHIOAJI_DATA_API_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SECRET_KEY=${POSEIDON_SHIOAJI_DATA_SECRET_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SIMULATION=${POSEIDON_SHIOAJI_DATA_SIMULATION:-true}
      - POSEIDON_US_STOCK_DATA_BACKEND=${POSEIDON_US_STOCK_DATA_BACKEND:-yfinance}
      - POSEIDON_POLYGON_API_KEY=${POSEIDON_POLYGON_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-artifacts:/data/models
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  qlib-research:
    # Python 3.12 Qlib training worker — subscribes to qlib_queue.
    # Runs as a long-lived Celery worker (Phase 41 D-10), replacing the
    # previous one-shot `profiles: ["research"]` approach. concurrency=1
    # and pool=solo are mandatory: pyqlib is not thread-safe and CUDA
    # ops need exclusive GPU access (D-13).
    build:
      context: .
      dockerfile: Dockerfile.qlib
    command: celery -A poseidon.workers.celery_app worker -Q qlib_queue -c 1 --pool=solo --loglevel=info --include=poseidon.workers.qlib_tasks
    environment:
      - TZ=Asia/Taipei
      - POSEIDON_DATABASE_URL=postgresql://poseidon:poseidon@host.docker.internal:5433/poseidon
      - POSEIDON_REDIS_URL=redis://host.docker.internal:6379/1
      - POSEIDON_FINMIND_TOKEN=${POSEIDON_FINMIND_TOKEN}
      - POSEIDON_FINLAB_API_TOKEN=${POSEIDON_FINLAB_API_TOKEN}
      - POSEIDON_TW_STOCK_DATA_BACKEND=${POSEIDON_TW_STOCK_DATA_BACKEND:-finlab}
      - POSEIDON_SHIOAJI_DATA_API_KEY=${POSEIDON_SHIOAJI_DATA_API_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SECRET_KEY=${POSEIDON_SHIOAJI_DATA_SECRET_KEY:-}
      - POSEIDON_SHIOAJI_DATA_SIMULATION=${POSEIDON_SHIOAJI_DATA_SIMULATION:-true}
      - POSEIDON_US_STOCK_DATA_BACKEND=${POSEIDON_US_STOCK_DATA_BACKEND:-yfinance}
      - POSEIDON_POLYGON_API_KEY=${POSEIDON_POLYGON_API_KEY:-}
      - MLFLOW_TRACKING_URI=postgresql+psycopg2://poseidon:poseidon@host.docker.internal:5433/poseidon
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model-artifacts:/data/models
      # Mount source for live edits during research sessions
      - ./src:/app/src
      - ./tests:/app/tests
      # Phase 39-02 Task 3: expose docker-compose.yml read-only so the
      # integration test suite can grep the backfill-worker service block
      # from inside the container.
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # Phase 39-03 Task 1: expose alembic/ read-only so migration shape
      # tests (e.g. data_coverage_mv DDL assertions) can read migration
      # files from inside the container without requiring a full image
      # rebuild on every migration change.
      - ./alembic:/app/alembic:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model-artifacts:
