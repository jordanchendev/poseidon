[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = postgresql://poseidon:poseidon@localhost:5432/poseidon

# Separate strategy-pipeline stream: `alembic -n pipeline upgrade head`.
# Its own revisions (p001...) and version table never collide with 0xx above.
[pipeline]
script_location = alembic
version_locations = %(here)s/alembic/pipeline_versions
prepend_sys_path = src
version_table = alembic_version_pipeline
target_metadata = poseidon.pipeline.models:PipelineBase
sqlalchemy.url = postgresql://poseidon:poseidon@localhost:5432/poseidon_pipeline

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
